name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  SBT_OPTS: >-
    -Xmx7G
    -Xms4G
    -Xss4M
    -XX:ReservedCodeCacheSize=512M

jobs:
  test_native:
    name: "${{ matrix.family }} / ${{ matrix.arch }} / ${{ matrix.runtime }} / tests / ${{ matrix.link }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc on Oracle Linux 10 - the RHEL 10 libuv 1.51.x floor.
          - link: dynamic
            family: linux
            arch: x86_64
            runtime: "glibc"
            runner: ubuntu-26.04
            dockerImage: shuwariafrica/el10-jdk:21
          - link: dynamic
            family: linux
            arch: aarch64
            runtime: "glibc"
            runner: ubuntu-26.04-arm
            dockerImage: shuwariafrica/el10-jdk:21
          # musl on Alpine 3.23 (release track, libuv 1.51.x, ships libuv-static for the static link).
          # These fail until a Scala Native release carries scala-native PR #4934 (sigaltstack/SIGSTKSZ fix
          # for musl; merged, unreleased at 0.5.12). The dynamic-musl cells stay as non-blocking coverage; the
          # static-musl cells are disabled entirely - the static link fails hard on the same defect and only
          # adds red noise. On the SN release: uncomment both static cells and drop `continueOnError` from all four.
          - link: dynamic
            family: linux
            arch: x86_64
            runtime: "musl"
            runner: ubuntu-26.04
            dockerImage: shuwariafrica/alpine-jdk:21
            continueOnError: true
          - link: dynamic
            family: linux
            arch: aarch64
            runtime: "musl"
            runner: ubuntu-26.04-arm
            dockerImage: shuwariafrica/alpine-jdk:21
            continueOnError: true
          # - link: static
          #   family: linux
          #   arch: x86_64
          #   runtime: "musl"
          #   runner: ubuntu-26.04
          #   dockerImage: shuwariafrica/alpine-jdk:21
          #   continueOnError: true
          # - link: static
          #   family: linux
          #   arch: aarch64
          #   runtime: "musl"
          #   runner: ubuntu-26.04-arm
          #   dockerImage: shuwariafrica/alpine-jdk:21
          #   continueOnError: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.continueOnError == true }}
    env:
      DOCKER_IMAGE: ${{ matrix.dockerImage }}
      EMILE_STATIC_LINK: ${{ matrix.link == 'static' && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Coursier cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
      - name: Run tests
        run: timeout -k 30s 25m ./project/scripts/run-sbt.sh -batch "Test/testOnly *"
      - name: Static-linkage assertion
        if: matrix.link == 'static'
        run: |
          emile_bin=$(find target/out -type f -name 'emile-test' -print -quit)
          fs2_bin=$(find target/out -type f -name 'emile-fs2-test' -print -quit)
          test -n "$emile_bin" || { echo "emile static test binary not found"; exit 1; }
          test -n "$fs2_bin"   || { echo "emile-fs2 static test binary not found"; exit 1; }
          for bin in "$emile_bin" "$fs2_bin"; do
            echo "--- $bin"
            file_out=$(file "$bin")
            ldd_out=$(ldd "$bin" 2>&1 || true)
            echo "$file_out"
            echo "ldd: $ldd_out"
            echo "$file_out" | grep -q 'statically linked'
            echo "$ldd_out" | grep -q 'not a dynamic executable'
          done

  static-analysis:
    name: analyse
    runs-on: ubuntu-26.04
    container: shuwariafrica/el10-jdk:21@sha256:06f9ac141b63cd2205a19437b37ba0ee38d92709eddbbf18e954a2cba53ea8cd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Coursier cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
      - name: Verify Source Formatting
        id: scalafmt
        continue-on-error: true
        run: timeout -k 30s 10m sbt --server -batch scalafmtCheckAll scalafmtSbtCheck
      - name: Verify Linting Conformity
        id: scalafix
        continue-on-error: true
        run: timeout -k 30s 10m sbt --server -batch "scalafixAll --check"
      - name: Verify File Header Conformity
        id: headers
        continue-on-error: true
        run: timeout -k 30s 10m sbt --server -batch headerCheckAll
      - name: Check for failures
        if: always()
        run: |
          failed=""
          [[ "${{ steps.scalafmt.outcome }}" == "failure" ]] && failed="$failed scalafmtCheckAll"
          [[ "${{ steps.scalafix.outcome }}" == "failure" ]] && failed="$failed scalafixAll"
          [[ "${{ steps.headers.outcome }}" == "failure" ]] && failed="$failed headerCheckAll"
          if [[ -n "$failed" ]]; then
            echo "::error::Static analysis checks failed:$failed"
            exit 1
          fi

  stress:
    name: concurrency
    runs-on: ubuntu-26.04
    env:
      DOCKER_IMAGE: shuwariafrica/el10-jdk:21
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Coursier cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
      - name: "Run concurrency-invariant suites"
        run: timeout -k 30s 25m ./project/scripts/run-sbt.sh -batch "emile-stress/testOnly *"

  publish:
    name: "publish / artefacts"
    needs: [ test_native, static-analysis, stress ]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-26.04
    container: shuwariafrica/el10-jdk:21@sha256:06f9ac141b63cd2205a19437b37ba0ee38d92709eddbbf18e954a2cba53ea8cd
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Import signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.OSS_PUBLISH_USER_SIGNING_KEY }}
      - name: Set up Coursier cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1
      - name: ${{ startsWith(github.ref, 'refs/tags/v') && 'Assemble Release' || 'Publish Snapshots' }}
        run: timeout -k 30s 30m sbt --server -batch publishSigned
        env:
          SONATYPE_USERNAME: ${{ secrets.OSS_PUBLISH_USER }}
          SONATYPE_PASSWORD: ${{ secrets.OSS_PUBLISH_USER_PASSPHRASE }}
      - name: Maven Central Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: timeout -k 30s 90m sbt --server -batch sonaRelease
        env:
          SONATYPE_USERNAME: ${{ secrets.OSS_PUBLISH_USER }}
          SONATYPE_PASSWORD: ${{ secrets.OSS_PUBLISH_USER_PASSPHRASE }}

  release:
    name: "publish / release"
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Mint Release Bot Token
        id: release-bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=(--title "${TAG}" --generate-notes --verify-tag)
          if [[ "${TAG}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" "${flags[@]}"

  dependency-graph:
    name: "report / dependency-graph"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    container: shuwariafrica/el10-jdk:21@sha256:06f9ac141b63cd2205a19437b37ba0ee38d92709eddbbf18e954a2cba53ea8cd
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up sbt
        uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - name: Submit Dependency Graph
        uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
